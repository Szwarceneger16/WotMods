<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medkit hotkeys</title><link rel="stylesheet" href="settings.css"></head>
<body><section id="grz-medkit-settings" class="grz-medkit-settings" role="dialog" aria-labelledby="grz-medkit-settings-title">
  <header class="grz-medkit-settings-header"><h1 id="grz-medkit-settings-title">Medkit hotkeys</h1><button id="grz-medkit-settings-close" class="grz-medkit-settings-close" type="button" aria-label="Close">×</button></header>
  <div class="grz-medkit-settings-row"><span id="grz-medkit-settings-label-mod" class="grz-medkit-settings-label">Toggle mod</span><button id="grz-medkit-settings-mod" class="grz-medkit-settings-binding" type="button">Not assigned</button><button id="grz-medkit-settings-clear-mod" class="grz-medkit-settings-clear" type="button">Clear</button></div>
  <div class="grz-medkit-settings-row"><span id="grz-medkit-settings-label-voice" class="grz-medkit-settings-label">Toggle voice</span><button id="grz-medkit-settings-voice" class="grz-medkit-settings-binding" type="button">Not assigned</button><button id="grz-medkit-settings-clear-voice" class="grz-medkit-settings-clear" type="button">Clear</button></div>
  <div id="grz-medkit-settings-hint" class="grz-medkit-settings-hint">Select a shortcut. Hold the keys together, then release all keys to save.</div>
  <div class="grz-medkit-settings-bottom"><div id="grz-medkit-settings-feedback" class="grz-medkit-settings-feedback" role="status" aria-live="polite"></div><button id="grz-medkit-settings-cancel" class="grz-medkit-settings-cancel" type="button">Cancel</button></div>
</section><script src="settings.js"></script></body></html>
