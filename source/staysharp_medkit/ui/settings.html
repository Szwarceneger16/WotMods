<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medkit hotkeys</title><link rel="stylesheet" href="settings.css"></head>
<body><section id="grz-medkit-settings" class="grz-medkit-settings" role="dialog" aria-labelledby="grz-medkit-settings-title">
  <header class="grz-medkit-settings-header"><span class="grz-medkit-settings-badge" aria-hidden="true"></span><h1 id="grz-medkit-settings-title">Medkit hotkeys</h1><button id="grz-medkit-settings-close" class="grz-medkit-settings-close" type="button" aria-label="Close"><span id="grz-medkit-settings-close-caption" class="grz-medkit-settings-button-label">×</span></button></header>
  <div class="grz-medkit-settings-body">
    <div class="grz-medkit-settings-row" role="group" aria-labelledby="grz-medkit-settings-label-mod"><span id="grz-medkit-settings-label-mod" class="grz-medkit-settings-label">Toggle mod</span><div class="grz-medkit-settings-controls"><button id="grz-medkit-settings-mod" class="grz-medkit-settings-binding" type="button" aria-describedby="grz-medkit-settings-hint"><span id="grz-medkit-settings-mod-caption" class="grz-medkit-settings-button-label">Not assigned</span></button><button id="grz-medkit-settings-clear-mod" class="grz-medkit-settings-clear" type="button"><span id="grz-medkit-settings-clear-mod-caption" class="grz-medkit-settings-button-label">Clear</span></button></div></div>
    <div class="grz-medkit-settings-row" role="group" aria-labelledby="grz-medkit-settings-label-voice"><span id="grz-medkit-settings-label-voice" class="grz-medkit-settings-label">Toggle voice</span><div class="grz-medkit-settings-controls"><button id="grz-medkit-settings-voice" class="grz-medkit-settings-binding" type="button" aria-describedby="grz-medkit-settings-hint"><span id="grz-medkit-settings-voice-caption" class="grz-medkit-settings-button-label">Not assigned</span></button><button id="grz-medkit-settings-clear-voice" class="grz-medkit-settings-clear" type="button"><span id="grz-medkit-settings-clear-voice-caption" class="grz-medkit-settings-button-label">Clear</span></button></div></div>
    <div id="grz-medkit-settings-hint" class="grz-medkit-settings-hint">Select a shortcut. Hold the keys together, then release all keys to save.</div>
    <div class="grz-medkit-settings-bottom"><div id="grz-medkit-settings-feedback" class="grz-medkit-settings-feedback" role="status" aria-live="polite"></div><button id="grz-medkit-settings-cancel" class="grz-medkit-settings-cancel" type="button"><span id="grz-medkit-settings-cancel-caption" class="grz-medkit-settings-button-label">Cancel</span></button></div>
  </div>
</section><script src="settings.js"></script></body></html>
