name: Validate shared PR CI

on:
  pull_request:
    branches: [main, ci/sessionstats-build-releases]
    paths:
      - '.github/workflows/*.yml'
      - '.github/actions/python27/**'
      - '.github/actions/python27-windows/**'
      - 'scripts/release_modules.json'
      - 'scripts/sessionstats/python27.sh'
      - 'scripts/sessionstats/validate.sh'
      - 'tests/ci/**'
      - 'tests/test_unified_release_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  routing:
    name: Check CI rules for all four mods
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test shared CI contracts
        run: python3 -B -m unittest discover -s tests/ci -v
