name: Verify World of Tanks source availability

on:
  pull_request:
    paths:
      - '.github/workflows/wot-source-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-availability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe public update sources
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://worldoftanks.eu/en/rss/news/' \
            'https://worldoftanks.eu/en/news/updates/micro-patch-2-4-1-3/' \
            'https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/?appid=1407200&count=30&format=json' \
            'https://steamdb.info/depot/1407600/manifests/'; do
            code=$(curl --location --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$url") || code=network-error
            printf '%s %s\n' "$code" "$url"
          done
