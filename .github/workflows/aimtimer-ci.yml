name: Validate GRZ AimTimer PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'mods/aimtimer/**'
      - 'scripts/reticles/**'
      - 'scripts/sessionstats/python27.sh'
      - 'mods/staysharp/assets/openwg_gameface_1.2.2.wotmod.b85'
      - 'mods/staysharp/assets/OPENWG_LICENSE'
      - 'scripts/release_installers.py'
      - 'scripts/release_version.py'
      - 'scripts/build_release_module.sh'
      - 'scripts/release_modules.json'
      - 'scripts/privacy_audit.py'
      - '.github/workflows/wot-updates.yml'
      - 'scripts/wot_updates.py'
      - 'tests/test_wot_updates.py'
      - '.github/workflows/aimtimer-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  updates:
    uses: ./.github/workflows/wot-updates.yml
    with:
      strict: false
  validate:
    needs: updates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify the installable ZIP
        shell: bash
        env:
          WOT_CLIENT: ${{ needs.updates.outputs.client_version }}
        run: |
          set -euo pipefail
          bash scripts/build_release_module.sh aimtimer "$(cat mods/aimtimer/VERSION)" "$WOT_CLIENT"
      - name: Upload installable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: release-module/GRZ_AimTimer-v*.zip
          archive: false
          retention-days: 14
          if-no-files-found: error
