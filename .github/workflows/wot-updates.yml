name: Check World of Tanks EU updates

on:
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false
      strict:
        type: boolean
        default: true
    outputs:
      client_version:
        value: ${{ jobs.check.outputs.client_version }}
      fresh:
        value: ${{ jobs.check.outputs.fresh }}
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/wot-updates.yml'
      - 'scripts/wot_updates.py'
      - 'scripts/wot_dispatch.py'
      - 'tests/test_wot_updates.py'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    # Serialize only this short preflight, not either mod's compilation.
    concurrency:
      group: wot-eu-update-cache-${{ github.repository }}-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    outputs:
      client_version: ${{ steps.refresh.outputs.client_version }}
      fresh: ${{ steps.refresh.outputs.fresh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test cache and production-source validation
        run: python3 -m unittest discover -s tests -p test_wot_updates.py -v
      - name: Restore latest update evidence
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .wot-update-cache
          key: wot-eu-evidence-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wot-eu-evidence-v1-
      - name: Refresh only expired evidence (always refresh at 06:00)
        id: refresh
        env:
          SCHEDULED: ${{ inputs.force }}
        run: |
          args=()
          if [[ "$SCHEDULED" == true ]]; then args+=(--force); fi
          python3 scripts/wot_updates.py "${args[@]}"
      - name: Save successful evidence or bounded failure backoff
        if: steps.refresh.outputs.refreshed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .wot-update-cache
          key: wot-eu-evidence-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Require fresh evidence for production
        if: steps.refresh.outputs.fresh != 'true' && (inputs.strict || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          echo '::error::EU update evidence is unavailable or stale. Inspect the summary; no publication is authorized.'
          exit 1

