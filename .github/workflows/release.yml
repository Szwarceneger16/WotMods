name: Release Stay Sharp

on:
  push:
    branches: [main]
    # Only Stay Sharp sources and its build/release machinery cause a release.
    paths:
      - 'source/**'
      - 'assets/**'
      - 'VERSION'
      - 'scripts/release_version.py'
      - 'scripts/release_snapshot.sh'
      - 'scripts/release_installers.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

# Independent builds can run in parallel. Only publication is serialized.
jobs:
  build:
    name: Test and build (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/release_version.py --run-number "$GITHUB_RUN_NUMBER")"
          printf 'version=%s\ntag=staysharp-v%s\n' "$version" "$version" >> "$GITHUB_OUTPUT"
          echo "WOTMOD_VERSION=$version" >> "$GITHUB_ENV"

      - name: Test, privacy audit and reproducible build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/privacy_audit.py
          python3 -m unittest discover -s tests -v
          python3 source/build_wotmod.py
          python3 scripts/privacy_audit.py --scan-dist
          (cd dist && sha256sum -- *.wotmod > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)

      - name: Preserve verified build for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staysharp-${{ steps.version.outputs.version }}
          path: |
            dist/*.wotmod
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release (write after successful build)
    needs: build
    if: github.ref == 'refs/heads/main'
    # ALL mod publishers must share this lock from latest snapshot through upload.
    # queue:max preserves rapid merge events instead of canceling pending runs.
    concurrency:
      group: wotmod-release-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    # Environment configuration can be approved by the repository owner.
    # The two non-secret variables below are an approval of one EXACT ruleset
    # revision, used only when GitHub hides the bypass actor list from this token.
    environment: staysharp-release
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Checkout exact merged commit for Git tag push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Retrieve verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staysharp-${{ needs.build.outputs.version }}
          path: dist

      - name: Verify exact build from previous job
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.wotmod' | wc -l)" -eq 1
          test -f "dist/com.staysharp.medkitreminder_${RELEASE_VERSION}.wotmod"
          (cd dist && sha256sum --check SHA256SUMS.txt)

      - name: Carry unchanged mods from latest immutable Release
        id: snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Acquire the shared publish lock BEFORE reading Latest. A reverse-
          # ordered older build exits 75 rather than rolling back a newer mod.
          python3 scripts/release_installers.py package release --source dist --mod staysharp
          if bash scripts/release_snapshot.sh release \
              "StaySharp-Medkit-v${RELEASE_VERSION}.zip" \
              'StaySharp-Medkit-v*.zip'; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" == 75 ]]; then
              echo '::notice::An equal/newer Stay Sharp build is already Latest; no obsolete Release created.'
              echo 'publish=false' >> "$GITHUB_OUTPUT"
            else
              exit "$status"
            fi
          fi

      - name: Verify two installers and prepare download sections
        if: steps.snapshot.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm release/SHA256SUMS.txt
          python3 scripts/release_installers.py verify release
          python3 scripts/release_installers.py notes release --output release-notes.md \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"

      - name: Create and verify GitHub Release
        if: steps.snapshot.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAYSHARP_REVIEWED_RULESET_ID: ${{ vars.STAYSHARP_REVIEWED_RULESET_ID }}
          STAYSHARP_REVIEWED_RULESET_UPDATED_AT: ${{ vars.STAYSHARP_REVIEWED_RULESET_UPDATED_AT }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          tag="$RELEASE_TAG"
          mod="com.staysharp.medkitreminder_${RELEASE_VERSION}.wotmod"

          # PRECONDITION: native GitHub tag protection is the race-free guard.
          # --verify-tag only checks existence; immutable Releases protect the
          # tag AFTER publication, not while gh is uploading its draft assets.
          # A ruleset blocking updates and deletes (with no bypass actors)
          # ensures no other writer can retarget the tag mid-publication.
          # The LIST endpoint contains summaries and does NOT expose target.
          # Filter on the server with targets=tag; validate target in GET detail.
          policy_ids="$(gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&targets=tag&per_page=100" \
            --jq '.[] | select(.name == "staysharp-release-tags" and .enforcement == "active") | .id')"
          if [[ ! "$policy_ids" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Missing or ambiguous active staysharp-release-tags Ruleset for staysharp-v* tags. Refusing to publish.' >&2
            exit 1
          fi
          policy="$(gh api -X GET "repos/$GITHUB_REPOSITORY/rulesets/$policy_ids")"
          # GitHub redacts bypass_actors unless the API caller can WRITE the
          # Ruleset (different from contents:write). Never map absence to [].
          # Without that field, require the repository OWNER to attest to one
          # exact reviewed ruleset ID/revision using environment variables.
          # A later edit (including adding a bypass) changes updated_at and
          # invalidates that approval, without a PAT or external GitHub App.
          if ! printf '%s' "$policy" | jq -e \
            --arg id "$policy_ids" \
            --arg approved_id "${STAYSHARP_REVIEWED_RULESET_ID:-}" \
            --arg approved_at "${STAYSHARP_REVIEWED_RULESET_UPDATED_AT:-}" '
            (.id | tostring) == $id and
            .name == "staysharp-release-tags" and .target == "tag" and .enforcement == "active" and
            .conditions.ref_name.include == ["refs/tags/staysharp-v*"] and
            (.conditions.ref_name.exclude // []) == [] and
            ([.rules[]?.type] | index("creation") == null and index("update") != null and index("deletion") != null) and
            (if has("bypass_actors") then
               (.bypass_actors == [])
             else
               ($approved_id == $id and $approved_at != "" and .updated_at == $approved_at)
             end)
          ' >/dev/null; then
            echo '::error::Unverified tag Ruleset. Require active staysharp-v* update/deletion protection and either visible empty bypass_actors or owner-attested Ruleset ID+updated_at in environment staysharp-release.' >&2
            exit 1
          fi

          # Read the tag directly from the server, never from a local cache.
          # Annotated tags need peeling to the commit they reference.
          check_remote_tag() {
            local peeled direct sha
            peeled="$(git ls-remote --tags origin "refs/tags/$tag^{}")"
            if [[ -n "$peeled" ]]; then
              sha="${peeled%%$'\t'*}"
            else
              direct="$(git ls-remote --tags origin "refs/tags/$tag")"
              sha="${direct%%$'\t'*}"
            fi
            if [[ "$sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Release tag $tag no longer points to expected build commit; stop publication." >&2
              return 1
            fi
          }

          # Ask GitHub CLI about drafts BEFORE creating any tag or Release.
          # No automated deletion or repair of existing releases.
          state="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 2000 --json tagName,isDraft | \
            jq -r --arg tag "$tag" '[.[] | select(.tagName == $tag)] | if length == 0 then "absent" elif length == 1 then (if .[0].isDraft then "draft" else "published" end) else "duplicate" end')"
          case "$state" in
            absent|published) ;;
            draft)
              echo "::error::Unfinished draft $tag. Review it in Releases; remove only the draft manually, keep the tag, then rerun THIS workflow." >&2
              exit 1
              ;;
            *) echo '::error::Invalid or ambiguous GitHub Releases listing.' >&2; exit 1 ;;
          esac

          # GitHub CLI stages Releases as drafts. Create the Git tag FIRST
          # and verify the exact commit before allowing release creation.
          refs="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [[ -z "$refs" ]]; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          resolved="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          test "$resolved" = "$GITHUB_SHA" || { echo 'Tag points to another commit' >&2; exit 1; }
          # Also check the CURRENT remote target; the local ref may be cached.
          check_remote_tag

          if [[ "$state" == absent ]]; then
            gh release create "$tag" release/*.zip \
              --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "WotMods — Stay Sharp Medkit ${RELEASE_VERSION}" --notes-file release-notes.md --generate-notes
          else
            echo 'Existing published release: verify only, never overwrite.'
          fi

          # Independent check immediately after gh's multi-request publication.
          # Native tag rules enforce immutability during its draft phase.
          check_remote_tag

          # Verify actual published assets, not merely file names or remote metadata.
          metadata="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets)"
          printf '%s' "$metadata" | jq -e --arg tag "$tag" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false' >/dev/null
          # Check the COMPLETE published snapshot, not just the changed mod.
          expected="$(find release -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          listed="$(printf '%s' "$metadata" | jq -r '.assets[].name' | LC_ALL=C sort)"
          test "$listed" = "$expected" || { echo 'Release asset list mismatch' >&2; exit 1; }
          remote="$(mktemp -d)"
          trap 'rm -rf -- "$remote"' EXIT
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$remote"
          received="$(find "$remote" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "$received" = "$expected" || { echo 'Downloaded asset list mismatch' >&2; exit 1; }
          while IFS= read -r name; do
            cmp -- "release/$name" "$remote/$name" || exit 1
          done <<< "$expected"
          python3 scripts/release_installers.py verify "$remote"
          # Final check re-resolves the Git ref; a local rev-parse is NOT enough.
          check_remote_tag
          echo "Published and verified: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
