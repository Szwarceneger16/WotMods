name: Validate Stay Sharp Medkit PR

on:
  pull_request:
    branches: [main]
    # CI for other mods is defined in their own workflows.
    paths:
      - 'source/**'
      - 'assets/**'
      - 'VERSION'
      - 'staysharp.medkit.example.json'
      - 'CHANGELOG.md'
      - 'docs/AUDIO.md'
      - 'scripts/release_version.py'
      - 'scripts/release_snapshot.sh'
      - 'scripts/release_installers.py'
      - 'tests/test_release_installers.py'
      - 'tests/test_staysharp_ci_artifact.py'
      - 'tests/test_pr_ci_scoping.py'
      - 'scripts/privacy_audit.py'
      - 'tests/test_mod.py'
      - 'tests/test_packaging.py'
      - 'tests/test_log_rotation.py'
      - 'tests/test_release_pipeline.py'
      - 'tests/test_release_workflow.py'
      - 'tests/test_release_snapshot.py'
      - 'tests/test_release_scoping.py'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Privacy, tests, deterministic build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python and base version
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          cat VERSION
      - name: Privacy scan
        shell: bash
        run: python3 scripts/privacy_audit.py
      - name: Unit and packaging tests
        shell: bash
        run: python3 -m unittest discover -s tests -v
      - name: Build reviewed version and check original v1.6.0 only when applicable
        shell: bash
        run: |
          set -euo pipefail
          python3 source/build_wotmod.py
          if [[ "$(cat VERSION)" == '1.6.0' ]]; then
            echo '9f3d98948ed398c3a4dc14b6785b68f10f1319381f896c6cd49b8709359c4927  dist/com.staysharp.medkitreminder_1.6.0.wotmod' | sha256sum --check --status
          fi
          python3 scripts/privacy_audit.py --scan-dist
      - name: Package reviewed Stay Sharp installer
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- *.wotmod > SHA256SUMS.txt)
          python3 scripts/release_installers.py package pr-artifact --source dist --mod staysharp
      - name: Test automatic next-release version with the same reviewed sources
        shell: bash
        run: |
          set -euo pipefail
          export WOTMOD_VERSION="$(python3 scripts/release_version.py --run-number 2)"
          echo "Testing generated patch version: $WOTMOD_VERSION"
          python3 -m unittest discover -s tests -q
          python3 source/build_wotmod.py
          python3 scripts/privacy_audit.py --scan-dist
      - name: Upload installable Stay Sharp Medkit ZIP without repackaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: pr-artifact/StaySharp-Medkit-v*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
