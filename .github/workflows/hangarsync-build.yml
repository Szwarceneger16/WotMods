name: Build Hangar Sync installer

on:
  push:
    branches: [main]
    paths:
      - 'mods/hangarsync/**'
      - 'scripts/hangarsync/**'
      - 'tests/test_hangarsync_*.py'
      - '.github/workflows/hangarsync-ci.yml'
      - '.github/workflows/hangarsync-build.yml'
      - 'scripts/sessionstats/python27.sh'
      - 'scripts/privacy_audit.py'
      - '.github/workflows/wot-updates.yml'
      - 'scripts/wot_updates.py'
      - 'scripts/wot_dispatch.py'
      - 'tests/test_wot_updates.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updates:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.repository == 'Szwarceneger16/WotMods' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/wot-updates.yml
    with:
      strict: false
  hangarsync:
    name: Build and audit accepted Hangar Sync revision
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.repository == 'Szwarceneger16/WotMods' && github.ref == 'refs/heads/main'
    needs: updates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: hangarsync-installer-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout accepted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile verified CPython 2.7.18
        run: bash scripts/sessionstats/python27.sh
      - name: Check Hangar Sync workflow and privacy boundaries
        run: python3 -m unittest discover -s tests -p 'test_hangarsync_*.py' -v
      - name: Test, build, audit and reproduce Hangar Sync
        run: bash scripts/hangarsync/validate.sh
      - name: Upload installer built from accepted main revision
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: mods/hangarsync/dist/GRZ_Hangar_Sync-v*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
