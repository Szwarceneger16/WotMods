name: Validate Session Stats PR

on:
  pull_request:
    branches: [main, ci/sessionstats-build-releases]
    # Native PR filters use the full branch diff, not just the newest commit.
    paths:
      - '.github/workflows/wot-updates.yml'
      - '.github/workflows/wot-update-watch.yml'
      - 'scripts/wot_updates.py'
      - 'scripts/wot_dispatch.py'
      - 'tests/test_wot_updates.py'
      - 'mods/sessionstats/**'
      - 'scripts/sessionstats/**'
      - 'scripts/release_version.py'
      - 'scripts/release_snapshot.sh'
      - 'scripts/release_installers.py'
      - 'scripts/release_coordinator.py'
      - 'scripts/release_ruleset.py'
      - 'scripts/release_modules.json'
      - 'scripts/build_release_module.sh'
      - 'scripts/privacy_audit.py'
      - 'tests/test_sessionstats_*.py'
      - 'tests/test_release_installers.py'
      - 'tests/test_hangar_release_installers.py'
      - 'tests/test_release_pipeline.py'
      - 'tests/test_release_snapshot.py'
      - 'tests/test_pr_ci_scoping.py'
      - 'tests/test_release_coordinator.py'
      - 'tests/test_release_ruleset.py'
      - 'tests/test_unified_release_workflow.py'
      - '.github/workflows/sessionstats-ci.yml'
      - '.github/workflows/wotmods-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updates:
    uses: ./.github/workflows/wot-updates.yml
    with:
      strict: false
  sessionstats:
    needs: updates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect source import
        id: source
        run: python3 scripts/sessionstats/source_state.py
      - name: Prepare pinned browser QA runtime
        if: steps.source.outputs.enabled == 'true'
        run: python3 -I scripts/sessionstats/browser_qa.py --prepare
      - name: Test release infrastructure
        run: |
          python3 -m unittest discover -s tests -p 'test_sessionstats_*.py' -v
          python3 -m unittest discover -s tests -p 'test_release_*.py' -v
          python3 -m unittest discover -s tests -p 'test_hangar_release_installers.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_ci_scoping.py' -v
      - name: Compile verified CPython 2.7.18 for game bytecode
        if: steps.source.outputs.enabled == 'true'
        run: bash scripts/sessionstats/python27.sh
      - name: Test, build, audit and reproduce Session Stats
        if: steps.source.outputs.enabled == 'true'
        run: bash scripts/sessionstats/validate.sh
      - name: Package independently verified Session Stats PR installer
        if: steps.source.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          python3 scripts/release_installers.py package pr-artifact-sessionstats \
            --source mods/sessionstats/dist --mod sessionstats
          python3 - <<'PY'
          from pathlib import Path
          from scripts.release_installers import verify
          installers = list(Path('pr-artifact-sessionstats').glob('Session-Stats-v*.zip'))
          assert len(installers) == 1
          assert verify(installers[0])[0] == 'sessionstats'
          PY
      - name: Upload installable Session Stats ZIP without repackaging
        if: steps.source.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: pr-artifact-sessionstats/Session-Stats-v*.zip
          # Upload the verified installer directly; no second ZIP wrapper.
          archive: false
          if-no-files-found: error
          retention-days: 14
